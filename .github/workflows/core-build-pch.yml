name: pch-build
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  # One concurrency group per workflow + ref.
  #
  # - PRs use `refs/pull/<PR_NUMBER>/merge`, so new commits cancel older
  #   in-progress runs for the same PR.
  # - A merge does NOT cancel the PR's own runs: this group is keyed on
  #   refs/pull/<N>/merge and the master push on refs/heads/master, so they
  #   never share a group. See the cancel-pr-runs-on-close workflow.
  # - Branch pushes are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  changes:
    if: github.repository == 'azerothcore/azerothcore-wotlk'
    uses: ./.github/workflows/detect-relevant-changes.yml
    # The workflow-level `permissions` above doesn't include pull-requests, and
    # a reusable-workflow call is capped by the caller's grant regardless of
    # what the called workflow's own `permissions:` asks for - so it has to be
    # re-granted here for paths-filter's PR-files API read to work.
    permissions:
      contents: read
      pull-requests: read

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            compiler:
              CC: clang-18
              CXX: clang++-18
          - os: ubuntu-26.04
            compiler:
              CC: clang-21
              CXX: clang++-21
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.compiler.CC }}-pch
    needs: changes
    if: github.repository == 'azerothcore/azerothcore-wotlk' && !github.event.pull_request.draft && needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build
        with:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
          pch: true
