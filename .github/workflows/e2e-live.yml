# On-demand live e2e (native only): dashboard-ci style stack, then go test.
#
#   acore.sh init installs host MySQL (no GHA services.mysql — that fights
#   install-deps systemctl start on :3306), compile, empty DBs, client-data
#   → dry-run schema → start auth + world (background binaries)
#   → go test -tags=e2e against 127.0.0.1
#
# Triggers: label `run-e2e` (smoke) | workflow_dispatch

name: e2e-live

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Go packages under e2e/ when scope=full'
        required: false
        default: './...'
      scope:
        description: 'smoke | full'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, full]
      count:
        required: false
        default: '1'
      timeout:
        description: 'go test -timeout (smoke default 30m; full should be >=120m)'
        required: false
        default: ''
      parallel:
        description: 'go test -parallel (in-package; keep 1 for pad safety)'
        required: false
        default: '1'
      package_parallel:
        description: 'go test -p (packages; keep 1 — only 10 unique IsolationPads)'
        required: false
        default: '1'
      tags_filter:
        description: 'E2E_TAGS for full scope only'
        required: false
        default: ''
      harness_ref:
        required: false
        default: ''

  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTINUOUS_INTEGRATION: true
  MYSQL_ROOT_PASSWORD: root

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    if: |
      github.repository == 'walkline/azerothcore-wotlk'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'pull_request'
          && !github.event.pull_request.draft
          && (
            (github.event.action == 'labeled' && github.event.label.name == 'run-e2e')
            || (
              github.event.action != 'labeled'
              && contains(github.event.pull_request.labels.*.name, 'run-e2e')
            )
          )
        )
      )
    outputs:
      scope: ${{ steps.check.outputs.scope }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ github.event.inputs.scope || 'smoke' }}"
          else
            scope="smoke"
          fi
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (native / ${{ needs.preflight.outputs.scope }})
    needs: preflight
    if: needs.preflight.result == 'success'
    # Host MySQL comes from acore.sh install-deps (dashboard-ci style). Do not
    # add services.mysql: it binds :3306 and systemctl start mysql.service fails.
    # PRs always GitHub-hosted (untrusted code). Self-hosted only via dispatch + E2E_RUNS_ON.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.E2E_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 480
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout AzerothCore
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout AzerothGhost harness
        uses: actions/checkout@v7
        with:
          repository: walkline/AzerothGhost
          path: _deps/AzerothGhost
          ref: ${{ github.event.inputs.harness_ref || vars.E2E_HARNESS_REF || '' }}
          token: ${{ secrets.E2E_HARNESS_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Wire harness module replace
        working-directory: e2e
        run: |
          set -euo pipefail
          harness="${GITHUB_WORKSPACE}/_deps/AzerothGhost"
          test -d "${harness}/e2e/e2eharness"
          go mod edit -replace="github.com/walkline/AzerothGhost=${harness}"
          go mod download

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache unzip curl
          ccache --version

      - name: Prepare ccache dir
        run: mkdir -p "${{ github.workspace }}/var/ccache"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/var/ccache
          key: ccache:e2e-live:ubuntu-24.04:${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache:e2e-live:ubuntu-24.04:${{ github.ref_name }}-
            ccache:e2e-live:ubuntu-24.04:

      - name: Setup ccache env
        env:
          CCACHE_DIR: ${{ github.workspace }}/var/ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          cat <<EOF >> "$GITHUB_ENV"
          CCACHE_BASEDIR=${{ github.workspace }}
          CCACHE_DIR=${{ github.workspace }}/var/ccache
          CCACHE_HASHDIR=1
          CCACHE_MAXSIZE=5G
          CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime
          CCACHE_COMPRESS=1
          CCACHE_COMPRESSLEVEL=3
          CCACHE_COMPILERCHECK=content
          CMAKE_C_COMPILER_LAUNCHER=ccache
          CMAKE_CXX_COMPILER_LAUNCHER=ccache
          EOF
          ccache -z || true

      - name: Configure AzerothCore (zero-conf CI)
        run: |
          set -euo pipefail
          touch conf/config.sh
          {
            echo 'MTHREADS=4'
            echo 'CBUILD_TESTING=OFF'
            echo 'AC_ENABLE_ROOT_CMAKE_INSTALL=1'
            echo 'export AC_CONFIG_POLICY=$AC_CONFIG_POLICY_PRESET_ZERO_CONF'
            echo 'AC_ENABLE_CONF_COPY_ON_INSTALL=0'
            echo 'CTYPE=RelWithDebInfo'
          } >> conf/config.sh
          cat conf/config.sh
          ./acore.sh config show AC_CONFIG_POLICY || true

      - name: Init (deps, compile, empty DBs, client-data download)
        env:
          MYSQL_ROOT_PASSWORD: root
          CONTINUOUS_INTEGRATION: true
        run: |
          set -euo pipefail
          # acore.sh init → install-deps, compile, create empty DBs (create_mysql.sql),
          # and inst_download_client_data. Schema is applied by -dry-run below
          # (same as dashboard-ci), not by init itself.
          ./acore.sh init
          ccache -s || true
        timeout-minutes: 180

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/var/ccache
          key: ccache:e2e-live:ubuntu-24.04:${{ github.ref_name }}-${{ github.run_id }}

      # create_mysql.sql only creates acore@localhost (unix_socket). Servers and
      # the harness connect via TCP 127.0.0.1, which needs a separate account host.
      # Grants are loopback-only (no root@% / acore@%) for self-hosted runner safety.
      - name: MySQL TCP grants for acore + root password
        env:
          MYSQL_ROOT_PASSWORD: root
        run: |
          set -euo pipefail
          mysql_root() {
            if sudo mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" -e 'SELECT 1' &>/dev/null; then
              sudo mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" "$@"
            elif sudo mysql -uroot -e 'SELECT 1' &>/dev/null; then
              sudo mysql -uroot "$@"
            else
              echo '::error::cannot connect to MySQL as root'
              exit 1
            fi
          }
          mysql_root <<'SQL'
          ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY 'root';
          CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'root';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'acore'@'127.0.0.1' IDENTIFIED BY 'acore';
          GRANT ALL PRIVILEGES ON `acore_world`.* TO 'acore'@'127.0.0.1' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON `acore_characters`.* TO 'acore'@'127.0.0.1' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON `acore_auth`.* TO 'acore'@'127.0.0.1' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'acore'@'localhost' IDENTIFIED BY 'acore';
          GRANT ALL PRIVILEGES ON `acore_world`.* TO 'acore'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON `acore_characters`.* TO 'acore'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON `acore_auth`.* TO 'acore'@'localhost' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          SQL
          mysql -h127.0.0.1 -uacore -pacore -e 'SELECT USER(), CURRENT_USER();' acore_auth

      # dashboard-ci applies base+updates via auth/world -dry-run before live start.
      # Copy .conf from .dist first: AC_ENABLE_CONF_COPY_ON_INSTALL=0 leaves only .dist.
      - name: Apply DB schema (authserver + worldserver dry-run)
        run: |
          # No -u: acore.sh does [ -z "$WITH_ERRORS" ] which fails under nounset.
          set -eo pipefail
          source ./acore.sh config load
          etc="$(cd env/dist/etc && pwd)"
          for n in authserver worldserver; do
            [[ -f "${etc}/${n}.conf" ]] || cp -v "${etc}/${n}.conf.dist" "${etc}/${n}.conf"
          done
          logs_dir="$(cd env/dist/bin && pwd)"
          sed -i \
            -e "s|^LogsDir *=.*|LogsDir = \"${logs_dir}\"|" \
            -e 's/^RealmsStateUpdateDelay *=.*/RealmsStateUpdateDelay = 1/' \
            "${etc}/authserver.conf"
          sed -i -e "s|^LogsDir *=.*|LogsDir = \"${logs_dir}\"|" "${etc}/worldserver.conf"
          cd env/dist/bin
          timeout 10m ./authserver -c "${etc}/authserver.conf" -dry-run 2>&1 | tee "$RUNNER_TEMP/authserver-dry-run.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || exit "$status"
          if grep -qE 'Applying of file .+ failed!' "$RUNNER_TEMP/authserver-dry-run.log"; then
            echo '::error::authserver dry-run failed to apply a SQL update'
            exit 1
          fi
          if grep -q 'Wrong Loggers configuration' "$RUNNER_TEMP/authserver-dry-run.log"; then
            echo '::error::authserver conf loggers not loaded (empty/missing conf?)'
            exit 1
          fi
          timeout 15m ./worldserver -c "${etc}/worldserver.conf" -dry-run 2>&1 | tee "$RUNNER_TEMP/worldserver-dry-run.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || exit "$status"
          if grep -qE 'Applying of file .+ failed!' "$RUNNER_TEMP/worldserver-dry-run.log"; then
            echo '::error::worldserver dry-run failed to apply a SQL update'
            exit 1
          fi
          if grep -q 'Wrong Loggers configuration' "$RUNNER_TEMP/worldserver-dry-run.log"; then
            echo '::error::worldserver conf loggers not loaded (empty/missing conf?)'
            exit 1
          fi
          mysql -h127.0.0.1 -uacore -pacore -e \
            "SHOW TABLES FROM acore_auth LIKE 'realmlist'; SELECT COUNT(*) AS realm_rows FROM acore_auth.realmlist;"
        timeout-minutes: 40

      - name: Realmlist + E2E env
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uacore -pacore -e \
            "UPDATE acore_auth.realmlist
             SET address='127.0.0.1', localAddress='127.0.0.1',
                 localSubnetMask='255.255.255.0', flag=0, port=8085, gamebuild=12340
             WHERE id=1;
             SELECT id,name,address,localAddress,localSubnetMask,port,flag,gamebuild
             FROM acore_auth.realmlist\G"
          {
            echo "E2E_AUTH_ADDR=127.0.0.1:3724"
            echo "E2E_AUTH_DSN=acore:acore@tcp(127.0.0.1:3306)/acore_auth"
            echo "E2E_CHAR_DSN=acore:acore@tcp(127.0.0.1:3306)/acore_characters"
            echo "E2E_WORLD_DSN=acore:acore@tcp(127.0.0.1:3306)/acore_world"
          } >> "$GITHUB_ENV"

      - name: Start authserver + worldserver (background)
        run: |
          set -euo pipefail
          cd env/dist/bin
          etc="$(cd ../etc && pwd)"
          [[ -f "${etc}/authserver.conf" ]] || cp -v "${etc}/authserver.conf.dist" "${etc}/authserver.conf"
          [[ -f "${etc}/worldserver.conf" ]] || cp -v "${etc}/worldserver.conf.dist" "${etc}/worldserver.conf"
          sed -i \
            -e 's/^Console\.Enable *=.*/Console.Enable = 0/' \
            -e 's/^Warden\.Enabled *=.*/Warden.Enabled = 0/' \
            -e 's/^BeepAtStart *=.*/BeepAtStart = 0/' \
            "${etc}/worldserver.conf"
          # Auth realm list refresh: 1s so flag clear is visible before smoke.
          sed -i -e 's/^RealmsStateUpdateDelay *=.*/RealmsStateUpdateDelay = 1/' "${etc}/authserver.conf"
          grep -E '^(Console|Warden|Beep|LogsDir|RealmsStateUpdateDelay)' \
            "${etc}/worldserver.conf" "${etc}/authserver.conf" || true

          wait_port() {
            local port="$1" name="$2" secs="${3:-120}"
            local i
            for i in $(seq 1 "${secs}"); do
              if (echo >"/dev/tcp/127.0.0.1/${port}") >/dev/null 2>&1; then
                echo "${name} listening on ${port} at ${i}s"
                return 0
              fi
              if ! kill -0 "$(cat "${RUNNER_TEMP}/${name}.pid")" 2>/dev/null; then
                echo "::error::${name} exited early"
                tail -n 150 "${RUNNER_TEMP}/${name}.log" 2>/dev/null || true
                return 1
              fi
              if (( i % 30 == 0 )); then
                echo "${name}: still waiting for port ${port} (${i}s)"
              fi
              sleep 1
            done
            echo "::error::${name} did not open port ${port} within ${secs}s"
            tail -n 150 "${RUNNER_TEMP}/${name}.log" 2>/dev/null || true
            return 1
          }

          # World first: Main.cpp binds :8085 only after SetInitialWorldSettings.
          ./worldserver -c "${etc}/worldserver.conf" \
            < /dev/null >"${RUNNER_TEMP}/worldserver.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/worldserver.pid"
          wait_port 8085 worldserver 300

          ./authserver -c "${etc}/authserver.conf" \
            < /dev/null >"${RUNNER_TEMP}/authserver.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/authserver.pid"
          wait_port 3724 authserver 60

          mysql -h127.0.0.1 -uacore -pacore -e \
            "UPDATE acore_auth.realmlist SET flag = flag & ~3 WHERE id=1;
             SELECT id,address,port,flag FROM acore_auth.realmlist;"
          # >= RealmsStateUpdateDelay (1s) + margin so in-memory realm list drops OFFLINE.
          sleep 3
          (echo >/dev/tcp/127.0.0.1/8085) >/dev/null 2>&1 || { echo '::error::world port lost'; exit 1; }
          (echo >/dev/tcp/127.0.0.1/3724) >/dev/null 2>&1 || { echo '::error::auth port lost'; exit 1; }
        timeout-minutes: 15

      - name: Validate E2E_*
        run: |
          set -euo pipefail
          for v in E2E_AUTH_ADDR E2E_AUTH_DSN E2E_CHAR_DSN E2E_WORLD_DSN; do
            [[ -n "${!v:-}" ]] || { echo "missing $v"; exit 1; }
          done
          echo "E2E_AUTH_ADDR=${E2E_AUTH_ADDR}"

      - name: Run go e2e
        working-directory: e2e
        env:
          # Inputs via env only — never expand untrusted workflow_dispatch into bash -c text.
          E2E_SCOPE: ${{ needs.preflight.outputs.scope }}
          E2E_COUNT: ${{ github.event.inputs.count || '1' }}
          E2E_TIMEOUT_INPUT: ${{ github.event.inputs.timeout || '' }}
          E2E_PARALLEL: ${{ github.event.inputs.parallel || '1' }}
          E2E_P: ${{ github.event.inputs.package_parallel || '1' }}
          E2E_PACKAGES: ${{ github.event.inputs.packages || './...' }}
          E2E_TAGS_FILTER: ${{ github.event.inputs.tags_filter || '' }}
        run: |
          set -euo pipefail
          count="${E2E_COUNT}"
          parallel="${E2E_PARALLEL}"
          p="${E2E_P}"
          scope="${E2E_SCOPE}"
          packages_raw="${E2E_PACKAGES}"

          # Packages must stay under e2e/ (no path escape).
          [[ "${packages_raw}" =~ ^\./[A-Za-z0-9_./\*+-]*$ ]] || { echo "bad packages"; exit 1; }
          [[ "${packages_raw}" != *..* ]] || { echo "packages must not contain .."; exit 1; }
          [[ "${count}" =~ ^[1-9][0-9]*$ ]] || { echo "bad count (need >=1)"; exit 1; }
          [[ "${parallel}" =~ ^[1-9][0-9]*$ ]] || { echo "bad parallel (need >=1)"; exit 1; }
          [[ "${p}" =~ ^[1-9][0-9]*$ ]] || { echo "bad package_parallel (need >=1)"; exit 1; }
          if (( parallel > 1 )); then
            echo "::warning::parallel=${parallel} >1 shares PackagePad within a package; prefer 1"
          fi
          if (( p > 1 )); then
            echo "::warning::package_parallel=${p} >1 may hash-share IsolationPads (only 10 unique)"
          fi
          if (( p > 10 )); then
            echo "package_parallel capped at 10 (IsolationPads size)"
            p=10
          fi
          if [[ -n "${E2E_TIMEOUT_INPUT}" ]]; then
            [[ "${E2E_TIMEOUT_INPUT}" =~ ^[0-9]+([.][0-9]+)?(ns|us|µs|ms|s|m|h)$ ]] \
              || { echo "bad timeout duration: ${E2E_TIMEOUT_INPUT}"; exit 1; }
            timeout="${E2E_TIMEOUT_INPUT}"
          elif [[ "${scope}" == "full" ]]; then
            timeout="120m"
          else
            timeout="30m"
          fi

          run_go_test() {
            go test -tags=e2e -count="${count}" -timeout="${timeout}" -parallel="${parallel}" -p "${p}" -v "$@"
          }

          if [[ "${scope}" == "smoke" ]]; then
            # Smoke package + suites tagged smoke (open-issue suites must not carry smoke).
            run_go_test ./smoke/
            E2E_TAGS=smoke run_go_test ./suites/...
          else
            if [[ -n "${E2E_TAGS_FILTER}" ]]; then
              export E2E_TAGS="${E2E_TAGS_FILTER}"
            fi
            # shellcheck disable=SC2086
            run_go_test ${packages_raw}
          fi

      - name: Stop servers
        if: always()
        run: |
          for n in worldserver authserver; do
            if [[ -f "${RUNNER_TEMP}/${n}.pid" ]]; then
              kill "$(cat "${RUNNER_TEMP}/${n}.pid")" 2>/dev/null || true
              sleep 2
              kill -9 "$(cat "${RUNNER_TEMP}/${n}.pid")" 2>/dev/null || true
            fi
            pkill -f "env/dist/bin/${n}" 2>/dev/null || true
          done

      - name: Logs on failure
        if: failure()
        run: |
          ls -la env/dist/bin/*.log env/dist/logs 2>/dev/null || true
          for f in env/dist/bin/Server.log env/dist/bin/Auth.log; do
            echo "==== ${f} ===="
            tail -n 150 "${f}" 2>/dev/null || true
          done
          for f in worldserver.log authserver.log authserver-dry-run.log worldserver-dry-run.log; do
            echo "==== ${RUNNER_TEMP}/${f} ===="
            tail -n 80 "${RUNNER_TEMP}/${f}" 2>/dev/null || true
          done

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            ${{ runner.temp }}/worldserver.log
            ${{ runner.temp }}/authserver.log
            ${{ runner.temp }}/authserver-dry-run.log
            ${{ runner.temp }}/worldserver-dry-run.log
          if-no-files-found: ignore
          retention-days: 7
