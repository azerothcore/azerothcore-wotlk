# On-demand live e2e: native stack like dashboard-ci, plus client data + go test.
#
# stack=native (default) — same family as dashboard-ci:
#   MySQL service → acore.sh init (compile + DB + client-data download)
#   → worldserver/authserver -dry-run (DB updater gate)
#   → pm2 sm start auth + world
#   → go test -tags=e2e against 127.0.0.1
#
# stack=docker — root docker-compose.yml (pull/build images) [optional]
# stack=external — secrets / self-hosted only
#
# Triggers: label `run-e2e` (smoke) | workflow_dispatch

name: e2e-live

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Go packages under e2e/ when scope=full'
        required: false
        default: './...'
      scope:
        description: 'smoke | full'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, full]
      stack:
        description: 'native = acore.sh init+data+sm | docker = compose | external = secrets'
        required: false
        default: 'native'
        type: choice
        options: [native, docker, external]
      build_images:
        description: 'docker only: build images from tree (slow)'
        required: false
        default: false
        type: boolean
      image_tag:
        description: 'docker only: DOCKER_IMAGE_TAG when pulling'
        required: false
        default: 'master'
      count:
        required: false
        default: '1'
      timeout:
        required: false
        default: '60m'
      parallel:
        required: false
        default: '1'
      tags_filter:
        required: false
        default: ''
      harness_ref:
        required: false
        default: ''

  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTINUOUS_INTEGRATION: true
  MYSQL_ROOT_PASSWORD: root
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  DOCKER_DB_ROOT_PASSWORD: password

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && (
          contains(github.event.pull_request.labels.*.name, 'run-e2e')
          || github.event.label.name == 'run-e2e'
        )
      )
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
      scope: ${{ steps.check.outputs.scope }}
      stack: ${{ steps.check.outputs.stack }}
      build_images: ${{ steps.check.outputs.build_images }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - id: check
        env:
          AUTH_ADDR: ${{ secrets.E2E_AUTH_ADDR }}
          AUTH_DSN: ${{ secrets.E2E_AUTH_DSN }}
          CHAR_DSN: ${{ secrets.E2E_CHAR_DSN }}
          WORLD_DSN: ${{ secrets.E2E_WORLD_DSN }}
          FORCE: ${{ vars.E2E_FORCE_RUN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ github.event.inputs.scope || 'smoke' }}"
            stack="${{ github.event.inputs.stack || 'native' }}"
            build_images="${{ github.event.inputs.build_images || 'false' }}"
            image_tag="${{ github.event.inputs.image_tag || 'master' }}"
          else
            scope="smoke"
            stack="native"
            build_images="false"
            image_tag="master"
          fi
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "stack=${stack}" >> "$GITHUB_OUTPUT"
          echo "build_images=${build_images}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

          case "${stack}" in
            native|docker)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=in-workflow stack=${stack}" >> "$GITHUB_OUTPUT"
              ;;
            external)
              if [[ -n "${FORCE:-}" && "${FORCE}" != "0" && "${FORCE}" != "false" ]]; then
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "reason=E2E_FORCE_RUN external" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              missing=()
              [[ -z "${AUTH_ADDR:-}" ]] && missing+=(E2E_AUTH_ADDR)
              [[ -z "${AUTH_DSN:-}"  ]] && missing+=(E2E_AUTH_DSN)
              [[ -z "${CHAR_DSN:-}"  ]] && missing+=(E2E_CHAR_DSN)
              [[ -z "${WORLD_DSN:-}" ]] && missing+=(E2E_WORLD_DSN)
              if ((${#missing[@]} > 0)); then
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                echo "reason=external missing secrets: ${missing[*]}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=external secrets present" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "reason=unknown stack=${stack}" >> "$GITHUB_OUTPUT"
              ;;
          esac

  skip-notice:
    name: soft-skip
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::${{ needs.preflight.outputs.reason }}"
          echo "Use stack=native (default) for in-workflow build+data+servers, or stack=docker."

  e2e:
    name: e2e (${{ needs.preflight.outputs.stack }} / ${{ needs.preflight.outputs.scope }})
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.should_run == 'true'
    runs-on: ${{ vars.E2E_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 360
    # MySQL for native stack (same idea as dashboard-ci MYSQL_ROOT_PASSWORD=root)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    steps:
      - name: Free disk
        if: needs.preflight.outputs.stack == 'native' || needs.preflight.outputs.stack == 'docker'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout AzerothCore
        uses: actions/checkout@v7

      - name: Checkout AzerothGhost harness
        uses: actions/checkout@v7
        with:
          repository: walkline/AzerothGhost
          path: _deps/AzerothGhost
          ref: ${{ github.event.inputs.harness_ref || vars.E2E_HARNESS_REF || '' }}
          token: ${{ secrets.E2E_HARNESS_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Wire harness module replace
        working-directory: e2e
        run: |
          set -euo pipefail
          harness="${GITHUB_WORKSPACE}/_deps/AzerothGhost"
          test -d "${harness}/e2e/e2eharness"
          go mod edit -replace="github.com/walkline/AzerothGhost=${harness}"
          go mod download

      # ===================== native stack (dashboard-ci style + data) =====================
      - name: Install ccache
        if: needs.preflight.outputs.stack == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache unzip curl

      - name: Configure AzerothCore (zero-conf CI)
        if: needs.preflight.outputs.stack == 'native'
        run: |
          set -euo pipefail
          touch conf/config.sh
          {
            echo 'MTHREADS=4'
            echo 'CBUILD_TESTING=OFF'
            echo 'AC_ENABLE_ROOT_CMAKE_INSTALL=1'
            echo 'export AC_CONFIG_POLICY=$AC_CONFIG_POLICY_PRESET_ZERO_CONF'
            echo 'AC_ENABLE_CONF_COPY_ON_INSTALL=0'
            echo 'CTYPE=RelWithDebInfo'
          } >> conf/config.sh
          cat conf/config.sh
          ./acore.sh config show AC_CONFIG_POLICY || true

      - name: Init (deps, compile, database, client-data download)
        if: needs.preflight.outputs.stack == 'native'
        env:
          MYSQL_ROOT_PASSWORD: root
          CONTINUOUS_INTEGRATION: true
        run: |
          set -euo pipefail
          # acore.sh init → install-deps, compile, create DBs, import SQL,
          # and inst_download_client_data (GitHub wowgaming/client-data zip).
          ./acore.sh init
          sudo npm install -g pm2
        timeout-minutes: 180

      - name: Dry-run auth + world (DB updater gate)
        if: needs.preflight.outputs.stack == 'native'
        run: |
          set -euo pipefail
          source ./acore.sh config load
          cd env/dist/bin
          timeout 10m ./authserver -dry-run 2>&1 | tee "$RUNNER_TEMP/authserver-dry-run.log"
          status=${PIPESTATUS[0]}; [ "$status" -eq 0 ] || exit "$status"
          if grep -qE "Applying of file .+ failed!" "$RUNNER_TEMP/authserver-dry-run.log"; then
            echo "::error::authserver dry-run SQL failure"; exit 1
          fi
          timeout 15m ./worldserver -dry-run 2>&1 | tee "$RUNNER_TEMP/worldserver-dry-run.log"
          status=${PIPESTATUS[0]}; [ "$status" -eq 0 ] || exit "$status"
          if grep -qE "Applying of file .+ failed!" "$RUNNER_TEMP/worldserver-dry-run.log"; then
            echo "::error::worldserver dry-run SQL failure"; exit 1
          fi
        timeout-minutes: 30

      - name: Start authserver + worldserver (pm2 service manager)
        if: needs.preflight.outputs.stack == 'native'
        run: |
          set -euo pipefail
          ./acore.sh sm create auth authserver --bin-path ./env/dist/bin --provider pm2
          ./acore.sh sm create world worldserver --bin-path ./env/dist/bin --provider pm2
          ./acore.sh sm start authserver
          ./acore.sh sm start worldserver
          ./acore.sh sm wait-uptime authserver 10 300
          ./acore.sh sm wait-uptime worldserver 10 600
        timeout-minutes: 30

      - name: Realmlist + E2E env (native)
        if: needs.preflight.outputs.stack == 'native'
        run: |
          set -euo pipefail
          # Zero-conf create_mysql.sql → user acore/acore; conf.dist matches.
          mysql -h127.0.0.1 -uroot -proot -e \
            "UPDATE acore_auth.realmlist SET address='127.0.0.1', localAddress='127.0.0.1';
             SELECT id,name,address,port FROM acore_auth.realmlist;"
          {
            echo "E2E_AUTH_ADDR=127.0.0.1:3724"
            echo "E2E_AUTH_DSN=acore:acore@tcp(127.0.0.1:3306)/acore_auth"
            echo "E2E_CHAR_DSN=acore:acore@tcp(127.0.0.1:3306)/acore_characters"
            echo "E2E_WORLD_DSN=acore:acore@tcp(127.0.0.1:3306)/acore_world"
          } >> "$GITHUB_ENV"
          echo "E2E_AUTH_ADDR=127.0.0.1:3724"

      # ===================== docker stack (optional) =====================
      - name: Docker pull/build/up
        if: needs.preflight.outputs.stack == 'docker'
        env:
          DOCKER_IMAGE_TAG: ${{ needs.preflight.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.preflight.outputs.build_images }}" == "true" ]]; then
            docker compose build ac-database ac-client-data-init ac-db-import ac-authserver ac-worldserver
          else
            docker compose pull ac-database ac-client-data-init ac-db-import ac-authserver ac-worldserver \
              || docker compose build ac-database ac-client-data-init ac-db-import ac-authserver ac-worldserver
          fi
          docker compose up -d ac-database
          docker compose up --no-build ac-client-data-init
          docker compose up --no-build ac-db-import
          docker compose up -d --no-build ac-authserver ac-worldserver
          for port in 3306 3724 8085; do
            for i in $(seq 1 120); do
              (echo >"/dev/tcp/127.0.0.1/${port}") >/dev/null 2>&1 && break
              sleep 2
            done
          done
          docker exec ac-database mysql -uroot -p"${DOCKER_DB_ROOT_PASSWORD}" -e \
            "UPDATE acore_auth.realmlist SET address='127.0.0.1', localAddress='127.0.0.1';"
          {
            echo "E2E_AUTH_ADDR=127.0.0.1:3724"
            echo "E2E_AUTH_DSN=root:${DOCKER_DB_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/acore_auth"
            echo "E2E_CHAR_DSN=root:${DOCKER_DB_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/acore_characters"
            echo "E2E_WORLD_DSN=root:${DOCKER_DB_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/acore_world"
          } >> "$GITHUB_ENV"
        timeout-minutes: 180

      # ===================== external =====================
      - name: Inject external secrets
        if: needs.preflight.outputs.stack == 'external' && secrets.E2E_AUTH_ADDR != ''
        env:
          E2E_AUTH_ADDR: ${{ secrets.E2E_AUTH_ADDR }}
          E2E_AUTH_DSN: ${{ secrets.E2E_AUTH_DSN }}
          E2E_CHAR_DSN: ${{ secrets.E2E_CHAR_DSN }}
          E2E_WORLD_DSN: ${{ secrets.E2E_WORLD_DSN }}
        run: |
          {
            echo "E2E_AUTH_ADDR=${E2E_AUTH_ADDR}"
            echo "E2E_AUTH_DSN=${E2E_AUTH_DSN}"
            echo "E2E_CHAR_DSN=${E2E_CHAR_DSN}"
            echo "E2E_WORLD_DSN=${E2E_WORLD_DSN}"
          } >> "$GITHUB_ENV"

      - name: Validate E2E_*
        run: |
          set -euo pipefail
          for v in E2E_AUTH_ADDR E2E_AUTH_DSN E2E_CHAR_DSN E2E_WORLD_DSN; do
            [[ -n "${!v:-}" ]] || { echo "missing $v"; exit 1; }
          done
          echo "E2E_AUTH_ADDR=${E2E_AUTH_ADDR}"

      - name: Run go e2e
        working-directory: e2e
        env:
          E2E_TAGS: ${{ github.event.inputs.tags_filter || '' }}
        run: |
          set -euo pipefail
          count="${{ github.event.inputs.count || '1' }}"
          timeout="${{ github.event.inputs.timeout || '60m' }}"
          parallel="${{ github.event.inputs.parallel || '1' }}"
          scope="${{ needs.preflight.outputs.scope }}"
          packages_raw="${{ github.event.inputs.packages || './...' }}"

          [[ "${packages_raw}" =~ ^\./[A-Za-z0-9_./\*+-]*$ ]] || { echo "bad packages"; exit 1; }

          run_go_test() {
            go test -tags=e2e -count="${count}" -timeout="${timeout}" -parallel="${parallel}" -v "$@"
          }

          if [[ "${scope}" == "smoke" ]]; then
            run_go_test ./smoke/
            E2E_TAGS=smoke run_go_test ./suites/...
          else
            # shellcheck disable=SC2086
            run_go_test ${packages_raw}
          fi

      - name: Stop native servers
        if: always() && needs.preflight.outputs.stack == 'native'
        run: |
          ./acore.sh sm stop worldserver || true
          ./acore.sh sm stop authserver || true
          ./acore.sh sm delete worldserver || true
          ./acore.sh sm delete authserver || true

      - name: Tear down docker
        if: always() && needs.preflight.outputs.stack == 'docker'
        run: docker compose down -v || true

      - name: Logs on failure
        if: failure()
        run: |
          if [[ "${{ needs.preflight.outputs.stack }}" == "native" ]]; then
            ls -la env/dist/logs 2>/dev/null || true
            tail -n 100 env/dist/logs/* 2>/dev/null || true
            ./acore.sh sm status || true
          fi
          if [[ "${{ needs.preflight.outputs.stack }}" == "docker" ]]; then
            docker compose logs --tail=150 || true
          fi
