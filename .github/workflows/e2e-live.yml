# On-demand live-stack e2e (AzerothGhost harness).
#
# Does NOT run on every PR by default — live auth/world/MySQL is too heavy for
# default CI and is not available on GH-hosted runners without extra setup.
#
# How to trigger
# --------------
# 1) PR label: add `run-e2e` to a non-draft PR (also re-runs on synchronize
#    while the label remains). Default scope is smoke-only.
# 2) Actions → "e2e-live" → Run workflow (workflow_dispatch) with optional
#    packages / count / timeout / parallel / tags_filter / harness_ref.
#
# Same pattern as `run-build` for docker/tools/macos/windows (see those ymls).
#
# Secrets / vars (repo or org)
# ----------------------------
# Required to actually execute tests (otherwise soft-skip success):
#   secrets.E2E_AUTH_ADDR   e.g. 127.0.0.1:3724 or host:3724 reachable from runner
#   secrets.E2E_AUTH_DSN    MySQL DSN for acore_auth
#   secrets.E2E_CHAR_DSN    MySQL DSN for acore_characters
#   secrets.E2E_WORLD_DSN   MySQL DSN for acore_world
#
# Optional:
#   vars.E2E_FORCE_RUN=1       run even without the four secrets (self-hosted
#                              runner must already export E2E_* in its env)
#   vars.E2E_RUNS_ON           runner label string (default ubuntu-latest).
#                              Use a self-hosted label when the stack is local
#                              to that runner, e.g. self-hosted
#   vars.E2E_HARNESS_REF       default AzerothGhost git ref when input empty
#   secrets.E2E_HARNESS_TOKEN  PAT if walkline/AzerothGhost is private
#
# Follow-ups: pin AzerothGhost in e2e/go.mod (pseudo-version) so CI need not
# path-replace; document failure classes in e2e/README.md.
#
# Docs: e2e/README.md → "On-demand e2e CI"

name: e2e-live

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Go package path(s) under e2e/ (relative, e.g. ./... ./smoke/...
          ./suites/quests/...). Ignored when scope=smoke.
        required: false
        default: './...'
      scope:
        description: 'smoke (fast gate) | full/custom (use packages input)'
        required: false
        default: 'full'
        type: choice
        options:
          - smoke
          - full
      count:
        description: 'go test -count'
        required: false
        default: '1'
      timeout:
        description: 'go test -timeout (e.g. 30m, 60m)'
        required: false
        default: '60m'
      parallel:
        description: 'go test -parallel (prefer 1–2 against one realm)'
        required: false
        default: '1'
      tags_filter:
        description: 'Optional E2E_TAGS filter (e.g. smoke,short)'
        required: false
        default: ''
      harness_ref:
        description: 'AzerothGhost git ref (branch/tag/SHA); empty = default branch or vars.E2E_HARNESS_REF'
        required: false
        default: ''

  pull_request:
    types:
      - labeled
      - synchronize
      - reopened

concurrency:
  # One concurrency group per workflow + ref.
  #
  # - PRs use `refs/pull/<PR_NUMBER>/merge`, so new commits cancel older
  #   in-progress runs for the same PR.
  # - Branch / workflow_dispatch runs are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # preflight — decide whether a live run is possible; never hard-fail the repo
  # when secrets / stack are missing (soft-skip instead).
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && (
          contains(github.event.pull_request.labels.*.name, 'run-e2e')
          || github.event.label.name == 'run-e2e'
        )
      )
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
      scope: ${{ steps.check.outputs.scope }}
    steps:
      - name: Evaluate secrets / opt-in
        id: check
        env:
          # Presence probe only — values are not printed.
          AUTH_ADDR: ${{ secrets.E2E_AUTH_ADDR }}
          AUTH_DSN: ${{ secrets.E2E_AUTH_DSN }}
          CHAR_DSN: ${{ secrets.E2E_CHAR_DSN }}
          WORLD_DSN: ${{ secrets.E2E_WORLD_DSN }}
          FORCE: ${{ vars.E2E_FORCE_RUN }}
        run: |
          set -euo pipefail

          # PR label runs are smoke-only; dispatch uses the scope input.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ github.event.inputs.scope || 'full' }}"
          else
            scope="smoke"
          fi
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"

          if [[ -n "${FORCE:-}" && "${FORCE}" != "0" && "${FORCE}" != "false" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=vars.E2E_FORCE_RUN set (assume runner-local E2E_* env / stack)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          [[ -z "${AUTH_ADDR:-}" ]] && missing+=(E2E_AUTH_ADDR)
          [[ -z "${AUTH_DSN:-}"  ]] && missing+=(E2E_AUTH_DSN)
          [[ -z "${CHAR_DSN:-}"  ]] && missing+=(E2E_CHAR_DSN)
          [[ -z "${WORLD_DSN:-}" ]] && missing+=(E2E_WORLD_DSN)

          if ((${#missing[@]} > 0)); then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing secrets: ${missing[*]} — soft-skip (see e2e/README.md On-demand e2e CI)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=E2E_* secrets present" >> "$GITHUB_OUTPUT"

      - name: Report preflight
        run: |
          echo "should_run=${{ steps.check.outputs.should_run }}"
          echo "scope=${{ steps.check.outputs.scope }}"
          echo "reason=${{ steps.check.outputs.reason }}"

  skip-notice:
    name: soft-skip
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain soft-skip
        run: |
          echo "::notice title=e2e-live soft-skipped::${{ needs.preflight.outputs.reason }}"
          cat <<'EOF'
          Live e2e did not run (soft-skip = success, not a red X).

          To enable:
            1. Add repository/org secrets:
                 E2E_AUTH_ADDR, E2E_AUTH_DSN, E2E_CHAR_DSN, E2E_WORLD_DSN
               pointing at a dedicated test realm reachable from the runner, OR
            2. Use a self-hosted runner with the stack already up and set:
                 vars.E2E_FORCE_RUN=1
                 vars.E2E_RUNS_ON=<your-runner-label>
               (do not inject empty secrets — they would clobber runner env)

          Trigger again with label `run-e2e` or workflow_dispatch.
          Docs: e2e/README.md → "On-demand e2e CI"
          EOF

  # ---------------------------------------------------------------------------
  # e2e — real go test -tags=e2e against the live stack
  # ---------------------------------------------------------------------------
  e2e:
    name: go-test (${{ needs.preflight.outputs.scope }})
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.should_run == 'true'
    runs-on: ${{ vars.E2E_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v7

      # go.mod currently pins AzerothGhost at v0.0.0 for local go.work replace.
      # CI checks out the harness repo and path-replaces until a real pseudo-version
      # is committed (see e2e/README.md follow-ups).
      - name: Checkout AzerothGhost harness
        uses: actions/checkout@v7
        with:
          repository: walkline/AzerothGhost
          path: _deps/AzerothGhost
          ref: ${{ github.event.inputs.harness_ref || vars.E2E_HARNESS_REF || '' }}
          token: ${{ secrets.E2E_HARNESS_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Wire harness module replace
        run: |
          set -euo pipefail
          harness="${GITHUB_WORKSPACE}/_deps/AzerothGhost"
          test -d "${harness}/e2e/e2eharness" || {
            echo "::error::AzerothGhost checkout missing e2e/e2eharness at ${harness}"
            exit 1
          }
          # go.work is gitignored; path-replace is the portable CI equivalent.
          go mod edit -replace="github.com/walkline/AzerothGhost=${harness}"
          go mod download
          go env GOPATH
          go list -m github.com/walkline/AzerothGhost

      # Inject secrets only when set so self-hosted runner env is not clobbered
      # by empty strings (FORCE_RUN path).
      - name: Inject E2E connection secrets
        if: ${{ secrets.E2E_AUTH_ADDR != '' }}
        env:
          E2E_AUTH_ADDR: ${{ secrets.E2E_AUTH_ADDR }}
          E2E_AUTH_DSN: ${{ secrets.E2E_AUTH_DSN }}
          E2E_CHAR_DSN: ${{ secrets.E2E_CHAR_DSN }}
          E2E_WORLD_DSN: ${{ secrets.E2E_WORLD_DSN }}
        run: |
          set -euo pipefail
          {
            echo "E2E_AUTH_ADDR=${E2E_AUTH_ADDR}"
            echo "E2E_AUTH_DSN=${E2E_AUTH_DSN}"
            echo "E2E_CHAR_DSN=${E2E_CHAR_DSN}"
            echo "E2E_WORLD_DSN=${E2E_WORLD_DSN}"
          } >> "${GITHUB_ENV}"

      - name: Validate runner has E2E_* 
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${E2E_AUTH_ADDR:-}" ]] && missing+=(E2E_AUTH_ADDR)
          [[ -z "${E2E_AUTH_DSN:-}"  ]] && missing+=(E2E_AUTH_DSN)
          [[ -z "${E2E_CHAR_DSN:-}"  ]] && missing+=(E2E_CHAR_DSN)
          [[ -z "${E2E_WORLD_DSN:-}" ]] && missing+=(E2E_WORLD_DSN)
          if ((${#missing[@]} > 0)); then
            echo "::error::E2E env not available on runner: ${missing[*]}"
            echo "Set secrets or export them on the self-hosted runner (vars.E2E_FORCE_RUN=1)."
            exit 1
          fi
          # Do not print DSN passwords; only show host-ish auth addr.
          echo "E2E_AUTH_ADDR=${E2E_AUTH_ADDR}"

      - name: Run live e2e
        env:
          E2E_TAGS: ${{ github.event.inputs.tags_filter || '' }}
        run: |
          set -euo pipefail

          count="${{ github.event.inputs.count || '1' }}"
          timeout="${{ github.event.inputs.timeout || '60m' }}"
          parallel="${{ github.event.inputs.parallel || '1' }}"
          scope="${{ needs.preflight.outputs.scope }}"
          packages_raw="${{ github.event.inputs.packages || './...' }}"

          # Inputs are restricted to relative package paths under e2e/.
          if [[ ! "${packages_raw}" =~ ^\./[A-Za-z0-9_./\*+-]*$ ]]; then
            echo "::error::invalid packages input (must be relative under e2e/): ${packages_raw}"
            exit 1
          fi
          if [[ ! "${count}" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid count: ${count}"
            exit 1
          fi
          if [[ ! "${timeout}" =~ ^[0-9]+[smh]$ ]]; then
            echo "::error::invalid timeout (use e.g. 30m): ${timeout}"
            exit 1
          fi
          if [[ ! "${parallel}" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid parallel: ${parallel}"
            exit 1
          fi

          echo "scope=${scope} count=${count} timeout=${timeout} parallel=${parallel} E2E_TAGS=${E2E_TAGS:-}"

          run_go_test() {
            # shellcheck disable=SC2086
            go test -tags=e2e -count="${count}" -timeout="${timeout}" -parallel="${parallel}" -v "$@"
          }

          if [[ "${scope}" == "smoke" ]]; then
            # Mirrors `make e2e-smoke`: dedicated smoke package + tagged suite tests.
            echo "::group::smoke package"
            run_go_test ./smoke/
            echo "::endgroup::"
            echo "::group::suites with E2E_TAGS=smoke"
            E2E_TAGS=smoke run_go_test ./suites/...
            echo "::endgroup::"
          else
            echo "::group::go test ${packages_raw}"
            # Intentionally unquoted packages_raw only after regex validation above.
            # shellcheck disable=SC2086
            run_go_test ${packages_raw}
            echo "::endgroup::"
          fi

      - name: Hint on failure classes
        if: failure()
        run: |
          cat <<'EOF'
          ::notice::Classify failures by harness prefixes:
            precondition:     setup never reached a judgeable state (infra/content)
            AC#N CONFIRMED BUG: tracked core bug (product)
            harness:          timeout / SQL / cache / send (infra)
            WARNING:          soft deviation (non-fatal)
          See .agents/docs/e2e-policy.md §9.4 and e2e/README.md.
          EOF
