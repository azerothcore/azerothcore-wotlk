# On-demand live e2e with an in-workflow AzerothCore stack (Docker Compose).
#
# Primary path (stack=docker, default):
#   docker compose up → MySQL + db-import + client-data + authserver + worldserver
#   then go test -tags=e2e against 127.0.0.1 (same compose as apps/docker + docker-compose.yml).
#
# Alternate (stack=external):
#   no containers; inject E2E_* secrets / self-hosted env (previous behaviour).
#
# Triggers
# --------
# - Label `run-e2e` on a non-draft PR → smoke tests + docker stack
# - workflow_dispatch → smoke|full, stack=docker|external, optional image build
#
# Does NOT run on every PR by default.

name: e2e-live

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Go packages under e2e/ (when scope=full), e.g. ./... or ./suites/combat/threat/'
        required: false
        default: './...'
      scope:
        description: 'smoke (fast) | full (packages input)'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
      stack:
        description: 'docker = compose stack in this job | external = use secrets/self-hosted env only'
        required: false
        default: 'docker'
        type: choice
        options:
          - docker
          - external
      build_images:
        description: 'docker only: build images from this tree (slow). false = pull acore/* from Docker Hub'
        required: false
        default: false
        type: boolean
      image_tag:
        description: 'DOCKER_IMAGE_TAG when pulling (default master)'
        required: false
        default: 'master'
      count:
        description: 'go test -count'
        required: false
        default: '1'
      timeout:
        description: 'go test -timeout'
        required: false
        default: '60m'
      parallel:
        description: 'go test -parallel (prefer 1)'
        required: false
        default: '1'
      tags_filter:
        description: 'Optional E2E_TAGS filter'
        required: false
        default: ''
      harness_ref:
        description: 'AzerothGhost git ref (empty = default branch)'
        required: false
        default: ''

  pull_request:
    types:
      - labeled
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  # Compose defaults match docker-compose.yml (root password "password", ports 3724/8085/3306).
  DOCKER_DB_ROOT_PASSWORD: password
  DOCKER_AUTH_EXTERNAL_PORT: '3724'
  DOCKER_WORLD_EXTERNAL_PORT: '8085'
  DOCKER_DB_EXTERNAL_PORT: '3306'

jobs:
  # ---------------------------------------------------------------------------
  # preflight — always allow docker mode; external mode needs secrets or FORCE
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && (
          contains(github.event.pull_request.labels.*.name, 'run-e2e')
          || github.event.label.name == 'run-e2e'
        )
      )
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
      scope: ${{ steps.check.outputs.scope }}
      stack: ${{ steps.check.outputs.stack }}
      build_images: ${{ steps.check.outputs.build_images }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - name: Evaluate
        id: check
        env:
          AUTH_ADDR: ${{ secrets.E2E_AUTH_ADDR }}
          AUTH_DSN: ${{ secrets.E2E_AUTH_DSN }}
          CHAR_DSN: ${{ secrets.E2E_CHAR_DSN }}
          WORLD_DSN: ${{ secrets.E2E_WORLD_DSN }}
          FORCE: ${{ vars.E2E_FORCE_RUN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ github.event.inputs.scope || 'smoke' }}"
            stack="${{ github.event.inputs.stack || 'docker' }}"
            build_images="${{ github.event.inputs.build_images || 'false' }}"
            image_tag="${{ github.event.inputs.image_tag || 'master' }}"
          else
            # Label runs: smoke + docker stack (no external secrets required).
            scope="smoke"
            stack="docker"
            build_images="false"
            image_tag="master"
          fi
          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "stack=${stack}" >> "$GITHUB_OUTPUT"
          echo "build_images=${build_images}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

          if [[ "${stack}" == "docker" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=docker compose stack (in-workflow)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # external stack
          if [[ -n "${FORCE:-}" && "${FORCE}" != "0" && "${FORCE}" != "false" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=vars.E2E_FORCE_RUN (external / runner-local stack)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [[ -z "${AUTH_ADDR:-}" ]] && missing+=(E2E_AUTH_ADDR)
          [[ -z "${AUTH_DSN:-}"  ]] && missing+=(E2E_AUTH_DSN)
          [[ -z "${CHAR_DSN:-}"  ]] && missing+=(E2E_CHAR_DSN)
          [[ -z "${WORLD_DSN:-}" ]] && missing+=(E2E_WORLD_DSN)
          if ((${#missing[@]} > 0)); then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=stack=external but missing secrets: ${missing[*]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=external stack secrets present" >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          echo "should_run=${{ steps.check.outputs.should_run }}"
          echo "stack=${{ steps.check.outputs.stack }}"
          echo "scope=${{ steps.check.outputs.scope }}"
          echo "build_images=${{ steps.check.outputs.build_images }}"
          echo "reason=${{ steps.check.outputs.reason }}"

  skip-notice:
    name: soft-skip
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain soft-skip
        run: |
          echo "::notice title=e2e-live soft-skipped::${{ needs.preflight.outputs.reason }}"
          cat <<'EOF'
          Live e2e did not run (soft-skip = success).

          Default path is stack=docker (in-workflow compose) — no secrets required.
          Use stack=external only when pointing at a pre-existing realm via E2E_* secrets.

          Docs: e2e/README.md → On-demand e2e CI
          EOF

  # ---------------------------------------------------------------------------
  # e2e — start stack (optional) + go test
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (${{ needs.preflight.outputs.stack }} / ${{ needs.preflight.outputs.scope }})
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.should_run == 'true'
    runs-on: ${{ vars.E2E_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - name: Free disk (docker builds)
        if: needs.preflight.outputs.stack == 'docker'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Checkout AzerothCore
        uses: actions/checkout@v7

      - name: Checkout AzerothGhost harness
        uses: actions/checkout@v7
        with:
          repository: walkline/AzerothGhost
          path: _deps/AzerothGhost
          ref: ${{ github.event.inputs.harness_ref || vars.E2E_HARNESS_REF || '' }}
          token: ${{ secrets.E2E_HARNESS_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Wire harness module replace
        working-directory: e2e
        run: |
          set -euo pipefail
          harness="${GITHUB_WORKSPACE}/_deps/AzerothGhost"
          test -d "${harness}/e2e/e2eharness"
          go mod edit -replace="github.com/walkline/AzerothGhost=${harness}"
          go mod download
          go list -m github.com/walkline/AzerothGhost

      # ---- docker stack (compose from repo root) ----
      - name: Set Docker image tag
        if: needs.preflight.outputs.stack == 'docker'
        run: |
          echo "DOCKER_IMAGE_TAG=${{ needs.preflight.outputs.image_tag }}" >> "$GITHUB_ENV"
          echo "DOCKER_DB_ROOT_PASSWORD=${DOCKER_DB_ROOT_PASSWORD}" >> "$GITHUB_ENV"

      - name: Pull prebuilt images
        if: needs.preflight.outputs.stack == 'docker' && needs.preflight.outputs.build_images != 'true'
        run: |
          set -euo pipefail
          # Prefer published images (acore/ac-wotlk-*). Build fallback if pull fails.
          if ! docker compose pull ac-database ac-client-data-init ac-db-import ac-authserver ac-worldserver; then
            echo "::warning::pull failed — will build from this tree"
            echo "NEED_BUILD=1" >> "$GITHUB_ENV"
          fi

      - name: Build images from tree
        if: |
          needs.preflight.outputs.stack == 'docker'
          && (needs.preflight.outputs.build_images == 'true' || env.NEED_BUILD == '1')
        run: |
          set -euo pipefail
          docker compose build ac-database ac-client-data-init ac-db-import ac-authserver ac-worldserver
        timeout-minutes: 180

      - name: Start compose stack
        if: needs.preflight.outputs.stack == 'docker'
        run: |
          set -euo pipefail
          # database → client-data-init + db-import → auth + world (depends_on in compose)
          docker compose up -d ac-database
          docker compose up --no-build ac-client-data-init
          docker compose up --no-build ac-db-import
          docker compose up -d --no-build ac-authserver ac-worldserver
          docker compose ps
        timeout-minutes: 60

      - name: Wait for auth/world ports
        if: needs.preflight.outputs.stack == 'docker'
        run: |
          set -euo pipefail
          wait_port() {
            local port=$1 name=$2
            echo "waiting for ${name} on :${port} ..."
            for i in $(seq 1 120); do
              if (echo >"/dev/tcp/127.0.0.1/${port}") >/dev/null 2>&1; then
                echo "${name} ready after ${i}s"
                return 0
              fi
              sleep 2
            done
            echo "::error::timeout waiting for ${name} :${port}"
            docker compose logs --tail=80 ac-authserver ac-worldserver ac-db-import || true
            return 1
          }
          wait_port 3306 mysql
          wait_port 3724 authserver
          wait_port 8085 worldserver

      - name: Point realmlist at localhost
        if: needs.preflight.outputs.stack == 'docker'
        run: |
          set -euo pipefail
          # Clients (and the e2e harness) run on the host; realm address must be 127.0.0.1.
          docker exec ac-database mysql -uroot -p"${DOCKER_DB_ROOT_PASSWORD}" -e \
            "UPDATE acore_auth.realmlist SET address='127.0.0.1', localAddress='127.0.0.1';
             SELECT id,name,address,localAddress,port FROM acore_auth.realmlist;"

      - name: Export E2E_* for docker stack
        if: needs.preflight.outputs.stack == 'docker'
        run: |
          set -euo pipefail
          # Host → published compose ports. MySQL user root / password from compose.
          {
            echo "E2E_AUTH_ADDR=127.0.0.1:3724"
            echo "E2E_AUTH_DSN=root:${DOCKER_DB_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/acore_auth"
            echo "E2E_CHAR_DSN=root:${DOCKER_DB_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/acore_characters"
            echo "E2E_WORLD_DSN=root:${DOCKER_DB_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/acore_world"
          } >> "${GITHUB_ENV}"
          echo "E2E_AUTH_ADDR=127.0.0.1:3724"

      # ---- external stack (optional) ----
      - name: Inject external E2E secrets
        if: needs.preflight.outputs.stack == 'external' && secrets.E2E_AUTH_ADDR != ''
        env:
          E2E_AUTH_ADDR: ${{ secrets.E2E_AUTH_ADDR }}
          E2E_AUTH_DSN: ${{ secrets.E2E_AUTH_DSN }}
          E2E_CHAR_DSN: ${{ secrets.E2E_CHAR_DSN }}
          E2E_WORLD_DSN: ${{ secrets.E2E_WORLD_DSN }}
        run: |
          set -euo pipefail
          {
            echo "E2E_AUTH_ADDR=${E2E_AUTH_ADDR}"
            echo "E2E_AUTH_DSN=${E2E_AUTH_DSN}"
            echo "E2E_CHAR_DSN=${E2E_CHAR_DSN}"
            echo "E2E_WORLD_DSN=${E2E_WORLD_DSN}"
          } >> "${GITHUB_ENV}"

      - name: Validate E2E_* present
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${E2E_AUTH_ADDR:-}" ]] && missing+=(E2E_AUTH_ADDR)
          [[ -z "${E2E_AUTH_DSN:-}"  ]] && missing+=(E2E_AUTH_DSN)
          [[ -z "${E2E_CHAR_DSN:-}"  ]] && missing+=(E2E_CHAR_DSN)
          [[ -z "${E2E_WORLD_DSN:-}" ]] && missing+=(E2E_WORLD_DSN)
          if ((${#missing[@]} > 0)); then
            echo "::error::missing: ${missing[*]}"
            exit 1
          fi
          echo "E2E_AUTH_ADDR=${E2E_AUTH_ADDR}"

      - name: Run live e2e
        working-directory: e2e
        env:
          E2E_TAGS: ${{ github.event.inputs.tags_filter || '' }}
        run: |
          set -euo pipefail
          count="${{ github.event.inputs.count || '1' }}"
          timeout="${{ github.event.inputs.timeout || '60m' }}"
          parallel="${{ github.event.inputs.parallel || '1' }}"
          scope="${{ needs.preflight.outputs.scope }}"
          packages_raw="${{ github.event.inputs.packages || './...' }}"

          if [[ ! "${packages_raw}" =~ ^\./[A-Za-z0-9_./\*+-]*$ ]]; then
            echo "::error::invalid packages: ${packages_raw}"
            exit 1
          fi
          [[ "${count}" =~ ^[0-9]+$ ]] || { echo "bad count"; exit 1; }
          [[ "${timeout}" =~ ^[0-9]+[smh]$ ]] || { echo "bad timeout"; exit 1; }
          [[ "${parallel}" =~ ^[0-9]+$ ]] || { echo "bad parallel"; exit 1; }

          run_go_test() {
            # shellcheck disable=SC2086
            go test -tags=e2e -count="${count}" -timeout="${timeout}" -parallel="${parallel}" -v "$@"
          }

          echo "scope=${scope} stack=${{ needs.preflight.outputs.stack }} count=${count}"

          if [[ "${scope}" == "smoke" ]]; then
            echo "::group::smoke"
            run_go_test ./smoke/
            echo "::endgroup::"
            echo "::group::suites E2E_TAGS=smoke"
            E2E_TAGS=smoke run_go_test ./suites/...
            echo "::endgroup::"
          else
            echo "::group::go test ${packages_raw}"
            # shellcheck disable=SC2086
            run_go_test ${packages_raw}
            echo "::endgroup::"
          fi

      - name: Dump stack logs on failure
        if: failure() && needs.preflight.outputs.stack == 'docker'
        run: |
          docker compose ps || true
          docker compose logs --tail=200 ac-authserver ac-worldserver ac-db-import ac-database || true

      - name: Tear down compose
        if: always() && needs.preflight.outputs.stack == 'docker'
        run: |
          docker compose down -v || true
