name: nopch-build
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      scope:
        description: 'e2e scope after the clang-18 build'
        required: false
        default: 'full'
        type: choice
        options: [smoke, full]

concurrency:
  # One concurrency group per workflow + ref.
  #
  # - PRs use `refs/pull/<PR_NUMBER>/merge`, so new commits cancel older
  #   in-progress runs for the same PR.
  # - A merge does NOT cancel the PR's own runs: this group is keyed on
  #   refs/pull/<N>/merge and the master push on refs/heads/master, so they
  #   never share a group. See the cancel-pr-runs-on-close workflow.
  # - Branch pushes are isolated by ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    if: github.repository == 'azerothcore/azerothcore-wotlk'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # workflow_dispatch is a manual "run this now": always treat it as
      # relevant rather than making a maintainer's explicit request depend on
      # the changed-files filter.
      relevant: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.relevant == 'true' }}
    steps:
      # paths-filter's token mode (no checkout, reads the changed-file list from
      # the API) only works for pull_request: there's no such API for a push, so
      # that case needs a real checkout to diff locally instead. workflow_dispatch
      # has no base to diff against at all, so the filter step is skipped for it
      # and the output above always reports relevant.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # every: a file only counts as excluded if it fails to match ALL
          # patterns below. The default (some) treats the leading '**' alone
          # as a match for every file, which made every PR "relevant"
          # regardless of what actually changed.
          predicate-quantifier: every
          filters: |
            relevant:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/FUNDING.yml'
              - '!.github/labeler.yml'

  # Split out of the matrix so e2e can needs: this cell only (not gcc/clang-21).
  build-e2e:
    name: ubuntu-24.04-clang-18-nopch
    needs: changes
    runs-on: ubuntu-24.04
    if: github.repository == 'azerothcore/azerothcore-wotlk' && !github.event.pull_request.draft && needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build
        with:
          CC: clang-18
          CXX: clang++-18
          pch: false
      - name: Upload server binaries for e2e
        uses: actions/upload-artifact@v4
        with:
          name: ac-server-ubuntu-24.04-clang-18
          path: |
            env/dist/bin/authserver
            env/dist/bin/worldserver
            env/dist/etc/
          if-no-files-found: error
          retention-days: 3

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            compiler:
              CC: gcc-15
              CXX: g++-15
          - os: ubuntu-26.04
            compiler:
              CC: clang-21
              CXX: clang++-21
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.compiler.CC }}-nopch
    needs: changes
    if: github.repository == 'azerothcore/azerothcore-wotlk' && !github.event.pull_request.draft && needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build
        with:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
          pch: false

  e2e:
    name: e2e ${{ inputs.scope || 'full' }}
    needs: [changes, build-e2e]
    # Official PR, master push, and dispatch. Master re-runs full so flakes
    # and merge-base drift show up after squash, not only on the PR head.
    if: |
      github.repository == 'azerothcore/azerothcore-wotlk'
      && !github.event.pull_request.draft
      && needs.changes.outputs.relevant == 'true'
      && needs.build-e2e.result == 'success'
      && (
        github.event_name == 'pull_request'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      )
    uses: ./.github/workflows/e2e-live.yml
    with:
      scope: ${{ inputs.scope || 'full' }}
      artifact_run_id: ${{ github.run_id }}
