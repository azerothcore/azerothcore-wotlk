# Shared "should this build even run" gate for the CI workflows below.
# Reusable workflow rather than a local composite action: a composite action
# has to be `uses: ./...`'d from a step, which requires the repo to already be
# checked out to resolve that local path - defeating the whole point of
# paths-filter's checkout-free token mode for pull_request. A reusable
# workflow is resolved by GitHub without a prior checkout, so the
# pull_request path stays genuinely checkout-free.
#
# Callers: core-build-pch.yml, core-build-nopch.yml, dashboard-ci.yml
name: Detect relevant changes

on:
  workflow_call:
    outputs:
      relevant:
        description: >
          'false' only when every changed file matches an ignored path (docs,
          issue templates, funding/labeler config). Always 'true' for
          workflow_dispatch, since a manual dispatch is an explicit request to
          run and has no base commit to diff against anyway.
        value: ${{ jobs.detect.outputs.relevant }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.relevant == 'true' }}
    steps:
      # paths-filter's token mode (no checkout, reads the changed-file list from
      # the API) only works for pull_request: there's no such API for a push, so
      # that case needs a real checkout to diff locally instead. workflow_dispatch
      # has no base to diff against at all, so the filter step is skipped for it
      # and the output above always reports relevant.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          token: ${{ github.token }}
          # some-with-excludes: a file is relevant if it matches at least one
          # positive pattern (here, the leading '**', i.e. everything) and no
          # negated ('!') pattern below. Equivalent here to the previously-used
          # 'every' (our only positive pattern is '**'), but says directly what
          # we mean instead of relying on that coincidence.
          predicate-quantifier: some-with-excludes
          filters: |
            relevant:
              - '**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/FUNDING.yml'
              - '!.github/labeler.yml'
